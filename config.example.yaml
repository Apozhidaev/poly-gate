# Poly-Gate configuration example.
# Copy to config.yaml (or point POLY_GATE_CONFIG at this file) and fill in values.

server:
  host: 0.0.0.0
  port: 8080

upstreams:
  gamma: https://gamma-api.polymarket.com
  data: https://data-api.polymarket.com
  clob: https://clob.polymarket.com
  pnl: https://user-pnl-api.polymarket.com
  chainId: 137

# Outbound rate limiting to Polymarket (recommended: keep enabled).
rateLimits:
  enabled: true

# Retries for idempotent outbound calls (POST /clob/order is never retried).
# Global defaults apply to all APIs; override per API via profiles.<api>.retries.
retries:
  enabled: true
  attempts: 30           # safety cap; the real limiter is maxElapsedMs
  baseDelayMs: 250
  maxDelayMs: 30000
  factor: 2
  maxElapsedMs: 1800000  # overall retry budget (30 min); 0 disables (use attempts only)

# Optional per-API overrides (retries: attempts, maxElapsedMs only).
# profiles:
#   clob:
#     retries:
#       maxElapsedMs: 60000
#   data:
#     retries:
#       maxElapsedMs: 3600000

# Outbound HTTP settings for requests to Polymarket.
http:
  # Per-attempt timeout for outbound requests (ms); 0 disables.
  # Turns a hung upstream connection into a retryable failure.
  # Keep above the slowest legitimate query (some historical endpoints ~1 min).
  timeoutMs: 120000

logLevel: info

# users is OPTIONAL. With no users the service still serves all public endpoints
# (Gamma, Data, CLOB market data). Only private CLOB endpoints require a user.
users: []
# users:
#   - id: main
#     # Gateway token: sent by clients as `Authorization: Bearer <token>`.
#     # Uniquely identifies + selects this wallet. Use a strong random value.
#     token: "REPLACE_WITH_STRONG_TOKEN"
#     # Private key of the signer (EOA). The signer address is derived from it.
#     privateKey: "0x..."
#     # Polymarket proxy wallet (deposit wallet / funder). NOT derivable from privateKey.
#     funder: "0x..."
#     # Signature type: 1=POLY_PROXY, 2=POLY_GNOSIS_SAFE, 3=POLY_1271 (default).
#     signatureType: 3
#     # L2 API credentials. Generate with `npm run derive-creds`.
#     creds:
#       apiKey: "..."
#       secret: "..."
#       passphrase: "..."
